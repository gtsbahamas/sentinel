<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Arena — Sentinel Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface-raised: #151518;
      --border: #1e1e2e;
      --border-hover: #2e2e4e;
      --accent: #818cf8;
      --accent-dim: rgba(129, 140, 248, 0.15);
      --text: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --green: #4ade80;
      --yellow: #facc15;
      --red: #f87171;
      --radius: 10px;
      --topbar-h: 56px;
      --bottombar-h: 48px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      overflow: hidden;
    }

    /* TOP BAR */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      z-index: 100;
    }

    .topbar-project {
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      white-space: nowrap;
    }

    .topbar-sep {
      color: var(--border);
      font-size: 18px;
    }

    .topbar-target {
      color: var(--text-dim);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .topbar-mode {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .topbar-mode.fresh {
      background: rgba(74, 222, 128, 0.12);
      color: var(--green);
      border: 1px solid rgba(74, 222, 128, 0.25);
    }

    .topbar-mode.evolve {
      background: rgba(250, 204, 21, 0.12);
      color: var(--yellow);
      border: 1px solid rgba(250, 204, 21, 0.25);
    }

    .topbar-spacer { flex: 1; }

    .breakpoint-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .bp-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-right: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .bp-btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .bp-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .bp-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    /* MAIN GRID */
    .gallery {
      position: fixed;
      top: var(--topbar-h);
      bottom: var(--bottombar-h);
      left: 0; right: 0;
      overflow-y: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: auto auto;
      gap: 16px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .card:nth-child(5) {
      grid-column: 1 / -1;
    }

    /* CARD */
    .card {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .card:hover .card-number {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .card-number {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .card-preview {
      flex: 1;
      overflow: hidden;
      position: relative;
      background: #fff;
      min-height: 260px;
    }

    .card-preview iframe {
      position: absolute;
      top: 0;
      left: 0;
      border: none;
      transform-origin: top left;
    }

    .card-info {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface);
      flex-shrink: 0;
    }

    .card-info .name {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
    }

    .card-info .author {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 6px;
    }

    .status {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .status.ready {
      color: var(--green);
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.2);
    }

    .status.running {
      color: var(--yellow);
      background: rgba(250, 204, 21, 0.1);
      border: 1px solid rgba(250, 204, 21, 0.2);
    }

    .status.error {
      color: var(--red);
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.2);
    }

    .status.pending {
      color: var(--text-muted);
      background: rgba(100, 116, 139, 0.1);
      border: 1px solid rgba(100, 116, 139, 0.2);
    }

    /* BOTTOM BAR */
    .bottombar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--bottombar-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      z-index: 100;
    }

    .bottombar-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .bottombar-hint kbd {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--border-hover);
      background: var(--bg);
      font-size: 11px;
      font-family: inherit;
      color: var(--text-dim);
    }

    .bottombar-spacer { flex: 1; }

    .action-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .action-btn:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }

    .action-btn.primary {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .action-btn.primary:hover {
      background: rgba(129, 140, 248, 0.25);
    }

    /* EXPANDED OVERLAY */
    .expanded-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.85);
      flex-direction: column;
    }

    .expanded-overlay.visible {
      display: flex;
    }

    .expanded-header {
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .expanded-badge {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }

    .expanded-title {
      font-weight: 600;
      font-size: 15px;
    }

    .expanded-author {
      font-size: 13px;
      color: var(--text-muted);
    }

    .expanded-header-spacer { flex: 1; }

    .nav-btn {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .nav-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .close-btn {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 18px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      margin-left: 4px;
    }

    .close-btn:hover {
      border-color: var(--red);
      color: var(--red);
      background: rgba(248, 113, 113, 0.1);
    }

    .expanded-body {
      flex: 1;
      overflow: hidden;
      background: #fff;
      position: relative;
    }

    .expanded-body iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .expanded-footer {
      height: var(--bottombar-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 8px;
      flex-shrink: 0;
    }

    .expanded-counter {
      font-size: 12px;
      color: var(--text-muted);
    }

    .expanded-footer-spacer { flex: 1; }

    .expanded-bp-group {
      display: flex;
      gap: 4px;
    }

    /* LOADING STATE */
    .card-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 260px;
      color: var(--text-muted);
      font-size: 13px;
      gap: 8px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <span class="topbar-project">Sentinel Dashboard</span>
    <span class="topbar-sep">/</span>
    <span class="topbar-target">Dashboard Redesign</span>
    <span class="topbar-mode fresh">fresh</span>
    <div class="topbar-spacer"></div>
    <span class="bp-label">Preview</span>
    <div class="breakpoint-group">
      <button class="bp-btn" onclick="setBreakpoint(390)">Mobile 390</button>
      <button class="bp-btn active" onclick="setBreakpoint(768)">Tablet 768</button>
      <button class="bp-btn" onclick="setBreakpoint(1440)">Desktop 1440</button>
    </div>
  </div>

  <!-- GALLERY -->
  <div class="gallery">
    <div class="grid" id="grid">
      <div class="card" onclick="expandCard(0)"><div class="card-number">1</div><div class="card-preview"><iframe srcdoc="" title="Frontend Design"></iframe></div><div class="card-info"><span><span class="name">Frontend Design</span><span class="author">Anthropic</span></span><span class="status ready">Ready</span></div></div><div class="card" onclick="expandCard(1)"><div class="card-number">2</div><div class="card-preview"><iframe srcdoc="" title="Taste Skill"></iframe></div><div class="card-info"><span><span class="name">Taste Skill</span><span class="author">Leonxlnx</span></span><span class="status ready">Ready</span></div></div><div class="card" onclick="expandCard(2)"><div class="card-number">3</div><div class="card-preview"><iframe srcdoc="" title="Interface Design"></iframe></div><div class="card-info"><span><span class="name">Interface Design</span><span class="author">Dammyjay93</span></span><span class="status ready">Ready</span></div></div>
    </div>
  </div>

  <!-- EXPANDED OVERLAY -->
  <div class="expanded-overlay" id="expandedOverlay">
    <div class="expanded-header">
      <div class="expanded-badge" id="expandedBadge">1</div>
      <span class="expanded-title" id="expandedTitle">Skill Name</span>
      <span class="expanded-author" id="expandedAuthor">by Author</span>
      <div class="expanded-header-spacer"></div>
      <button class="nav-btn" id="prevBtn" onclick="navExpanded(-1)" title="Previous (←)">&#8592;</button>
      <button class="nav-btn" id="nextBtn" onclick="navExpanded(1)" title="Next (→)">&#8594;</button>
      <button class="close-btn" onclick="closeExpanded()" title="Close (Esc)">&#x2715;</button>
    </div>
    <div class="expanded-body">
      <iframe id="expandedIframe" srcdoc="" title="Skill preview"></iframe>
    </div>
    <div class="expanded-footer">
      <span class="expanded-counter" id="expandedCounter">1 / 5</span>
      <div class="expanded-footer-spacer"></div>
      <div class="expanded-bp-group">
        <button class="bp-btn" onclick="setExpandedBreakpoint(390)">Mobile</button>
        <button class="bp-btn active" onclick="setExpandedBreakpoint(768)">Tablet</button>
        <button class="bp-btn" onclick="setExpandedBreakpoint(1440)">Desktop</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottombar">
    <span class="bottombar-hint">
      Click a card to expand &nbsp;&middot;&nbsp;
      <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> navigate &nbsp;&middot;&nbsp;
      <kbd>Esc</kbd> close
    </span>
    <div class="bottombar-spacer"></div>
    <button class="action-btn" onclick="refreshGallery()">Refresh</button>
    <button class="action-btn primary" onclick="selectWinner()">Select Winner in Terminal</button>
  </div>

  <script>
    const skills = {{SKILLS_JSON}};

    let currentBreakpoint = 768;
    let currentExpandedIndex = -1;
    let expandedBreakpoint = 768;

    // ---- BREAKPOINT TOGGLE ----

    function setBreakpoint(width) {
      currentBreakpoint = width;
      document.querySelectorAll('.breakpoint-group .bp-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(String(width)));
      });
      updateAllIframeScales();
    }

    function setExpandedBreakpoint(width) {
      expandedBreakpoint = width;
      document.querySelectorAll('.expanded-bp-group .bp-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase().includes(
          width === 390 ? 'mobile' : width === 768 ? 'tablet' : 'desktop'
        ));
      });
      const iframe = document.getElementById('expandedIframe');
      iframe.style.width = width + 'px';
      const body = document.querySelector('.expanded-body');
      const containerW = body.clientWidth;
      if (width > containerW) {
        const scale = containerW / width;
        iframe.style.transformOrigin = 'top left';
        iframe.style.transform = `scale(${scale})`;
        iframe.style.height = (body.clientHeight / scale) + 'px';
        iframe.style.width = width + 'px';
        iframe.style.position = 'absolute';
        iframe.style.top = '0';
        iframe.style.left = '0';
      } else {
        iframe.style.transform = '';
        iframe.style.width = width + 'px';
        iframe.style.height = '100%';
        iframe.style.position = 'absolute';
        iframe.style.top = '0';
        iframe.style.left = '50%';
        iframe.style.marginLeft = -(width / 2) + 'px';
      }
    }

    function updateAllIframeScales() {
      document.querySelectorAll('.card-preview').forEach((preview, i) => {
        const iframe = preview.querySelector('iframe');
        if (!iframe) return;
        const containerW = preview.clientWidth;
        const containerH = preview.clientHeight;
        const targetW = currentBreakpoint;
        const scale = containerW / targetW;
        iframe.style.width = targetW + 'px';
        iframe.style.height = (containerH / scale) + 'px';
        iframe.style.transform = `scale(${scale})`;
        iframe.style.transformOrigin = 'top left';
        iframe.style.position = 'absolute';
        iframe.style.top = '0';
        iframe.style.left = '0';
      });
    }

    // ---- EXPAND / CLOSE ----

    function expandCard(index) {
      if (index < 0 || index >= skills.length) return;
      currentExpandedIndex = index;
      const skill = skills[index];

      const overlay = document.getElementById('expandedOverlay');
      overlay.classList.add('visible');

      document.getElementById('expandedBadge').textContent = index + 1;
      document.getElementById('expandedTitle').textContent = skill.label || skill.name;
      document.getElementById('expandedAuthor').textContent = 'by ' + (skill.author || 'Unknown');
      document.getElementById('expandedCounter').textContent = (index + 1) + ' / ' + skills.length;

      const iframe = document.getElementById('expandedIframe');
      iframe.srcdoc = skill.html || '';
      iframe.style.transform = '';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.position = 'absolute';
      iframe.style.top = '0';
      iframe.style.left = '0';
      iframe.style.marginLeft = '';

      // reset expanded breakpoint buttons
      document.querySelectorAll('.expanded-bp-group .bp-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      // apply current breakpoint to expanded view too
      setExpandedBreakpoint(expandedBreakpoint);

      updateNavButtons();
      document.body.style.overflow = 'hidden';
    }

    function closeExpanded() {
      const overlay = document.getElementById('expandedOverlay');
      overlay.classList.remove('visible');
      currentExpandedIndex = -1;
      document.body.style.overflow = '';
    }

    function navExpanded(dir) {
      const next = currentExpandedIndex + dir;
      if (next >= 0 && next < skills.length) {
        expandCard(next);
      }
    }

    function updateNavButtons() {
      document.getElementById('prevBtn').disabled = currentExpandedIndex <= 0;
      document.getElementById('nextBtn').disabled = currentExpandedIndex >= skills.length - 1;
    }

    // ---- KEYBOARD ----

    document.addEventListener('keydown', (e) => {
      const overlay = document.getElementById('expandedOverlay');
      if (!overlay.classList.contains('visible')) return;
      if (e.key === 'Escape') closeExpanded();
      if (e.key === 'ArrowLeft') navExpanded(-1);
      if (e.key === 'ArrowRight') navExpanded(1);
    });

    // ---- BOTTOM BAR ACTIONS ----

    function refreshGallery() {
      location.reload();
    }

    function selectWinner() {
      const choice = prompt(
        'Enter skill number (1–' + skills.length + ') to select as winner:',
        currentExpandedIndex >= 0 ? String(currentExpandedIndex + 1) : '1'
      );
      if (!choice) return;
      const idx = parseInt(choice, 10) - 1;
      if (isNaN(idx) || idx < 0 || idx >= skills.length) {
        alert('Invalid selection. Enter a number between 1 and ' + skills.length + '.');
        return;
      }
      const skill = skills[idx];
      alert(
        'Selected: ' + (skill.label || skill.name) + '

' +
        'Run in terminal:
  skill-arena select ' + (idx + 1)
      );
    }

    // ---- INIT ----

    function init() {
      updateAllIframeScales();
    }

    window.addEventListener('load', init);
    window.addEventListener('resize', updateAllIframeScales);
  </script>
</body>
</html>
